# =============================================================================
# Single source of truth for paths and hyper-parameters.
# Override any field from the CLI, e.g.:
#   python scripts/02_train_unet.py --config configs/config.yaml --set train.epochs=5
# =============================================================================

project:
  seed: 42
  # Everything the scripts write (figures, csv, checkpoints) goes under this root.
  output_dir: "outputs"

data:
  # ---- CrackSeg9k: flat folders of images and binary masks -------------------
  crackseg9k:
    images_dir: "datasets/crackseg9k/images"
    masks_dir: "datasets/crackseg9k/masks"
    # Masks are binarised as (mask > mask_threshold) -> crack = 1.
    mask_threshold: 0
    # Random split, stratified is not needed for a binary dense task.
    val_fraction: 0.15
    test_fraction: 0.15

  # ---- dacl10k: official layout images/<split>, annotations/<split> ---------
  dacl10k:
    root: "datasets/dacl10k"
    train_split: "train"
    val_split: "validation"
    crack_labels: ["Crack", "ACrack"]

  p1:
    task_name: "dacl10k_crack_binary"
    train_positive_fraction: 0.50
    use_weighted_sampler: true
    save_qualitative_split: "val"

  p1_patch:
    task_name: "dacl10k_crack_patch_glb_positive_quota"
    patch_size: 512
    positive_patch_fraction: 0.60
    min_positive_pixels: 16
    max_negative_pixels: 0
    max_crop_attempts: 100       # maximum number of attempts to find a patch with enough positive pixels
    patches_per_image: 4

    eval_stride: 256            # Stride for sliding-window inference
    eval_batch_size: 4          # Batch size for sliding-window inference
    blend_mode: "gaussian"      # Blend mode for overlapping patches: "gaussian" | "linear" | "constant"

    sanity_check_samples: 512   # Number of samples to use for sanity check during training
 
  image_size: 512
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 4

model:
  arch: "unet"                 # unet | unetplusplus | deeplabv3plus
  encoder: "resnet34"          # smp encoder name
  encoder_weights: "imagenet"  # null to train from scratch
  in_channels: 3
  classes: 1                   # binary crack segmentation

loss:
  # Total loss = bce_weight * BCEWithLogits + dice_weight * SoftDice
  bce_weight: 0.5
  dice_weight: 0.5
  # >1.0 up-weights the (rare) crack pixels inside the BCE term.
  pos_weight: 2.0

train:
  epochs: 30
  batch_size: 4
  accumulation_steps: 2        # effective batch = batch_size * accumulation_steps
  lr: 0.0003
  weight_decay: 0.0001
  amp: true                    # mixed precision: ~2x faster on Colab T4
  early_stopping_patience: 10
  resume: true
  warmup_epochs: 2
  warmup_start_factor: 0.1
  # Cosine annealing with warm restarts (SGDR).
  scheduler:
    t_0: 10                     # epochs before the first restart
    t_mult: 1                  # each cycle lasts t_mult times the previous one
    eta_min: 0.000005

eval:
  # Threshold applied to sigmoid(logits).
  threshold: 0.5
  threshold_sweep: [0.3, 0.4, 0.5, 0.6, 0.7]
  n_qualitative_samples: 6
